name: Build Bot

on:
  pull_request:
    paths:
      - bot/**
      - global.json
      - .gitattributes
      - .github/workflows/bot-build.yml
      - .github/workflows/frontend-checks.yml

permissions:
  contents: read

jobs:
  build-solution:
    name: Build Solution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x
      - run: dotnet build bot/ChampionsOfKhazad.Bot.slnx
      - run: dotnet test --solution bot/ChampionsOfKhazad.Bot.slnx --no-build --minimum-expected-tests 1

  build-frontend:
    name: Build Frontend
    uses: ./.github/workflows/frontend-checks.yml

  deploy-dry-run:
    name: Deploy Dry Run
    needs: [build-solution, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x
      - name: Deploy Bot
        uses: pulumi/actions@v7
        with:
          command: preview
          stack-name: prod
          work-dir: bot/src/ChampionsOfKhazad.Bot.Infrastructure/
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
